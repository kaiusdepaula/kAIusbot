[project]
name = "kAIusbot"
version = "0.1.0"
description = "All-in-one personal AI assistant running on local hardware"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit",
    "pydantic-ai-slim[mcp,openai]>=1.0,<2.0",
    "mlflow>=2.14.0",
    "litecli>=0.17.1",
    "torch>=2.13.0",
    "torchvision>=0.27.0",
    "triton-rocm>=3.7.1",
    "duckdb",
    "sentence-transformers>=3.4.1",
    "faiss-cpu>=0.8.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm" },
]
torchvision = [
  { index = "pytorch-rocm" },
]
triton-rocm = [
  { index = "pytorch-rocm" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
